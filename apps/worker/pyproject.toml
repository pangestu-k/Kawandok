[project]
name = "office-ai-worker"
version = "0.2.0"
description = "Document ingestion worker for the Office AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "redis==5.0.8",
    "psycopg[binary]==3.2.3",
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "boto3==1.35.10",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
