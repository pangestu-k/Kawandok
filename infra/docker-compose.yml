services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_migrator_password}
      POSTGRES_DB: ${POSTGRES_DB:-office_ai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-migrator} -d ${POSTGRES_DB:-office_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-dir=/data", "-filer", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata: {}
  s3data: {}
