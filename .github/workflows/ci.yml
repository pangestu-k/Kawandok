name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: dev_migrator_password
          POSTGRES_DB: office_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U migrator -d office_ai"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          ACL_TEST_DATABASE_URL: postgres://migrator:dev_migrator_password@127.0.0.1:5432/office_ai?sslmode=disable

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: dev_migrator_password
          POSTGRES_DB: office_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U migrator -d office_ai"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml
      - run: python -m pip install redis==5.0.8 "psycopg[binary]==3.2.3" pypdf==4.3.1 python-docx==1.1.2 openpyxl==3.1.5 boto3==1.35.10
      - run: python -m unittest discover -s tests
        env:
          WORKER_TEST_DATABASE_URL: postgres://migrator:dev_migrator_password@127.0.0.1:5432/office_ai?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
